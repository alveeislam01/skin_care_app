    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    .container {
      position: relative;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 50px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      color: white;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .btn.signup {
      background: #28a745;
      color: white;
    }

    .btn.login {
      background: #007bff;
      color: white;
    }

    .btn:hover {
      opacity: 0.8;
    }

  <div class="container">
    <h1>Welcome to Skin Disease Detection and Consultation System</h1>
    <div class="buttons">
      <button class="btn signup">Sign Up</button>
      <button class="btn login">Log In</button>
    </div>
  </div>
